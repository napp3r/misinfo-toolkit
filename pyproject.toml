[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "misinfo-toolkit"
version = "0.1.0"
description = "Reproducible toolkit for tweet-level misinformation detection (TF-IDF baselines + causal cue features) on the MiDe22 dataset."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Dair Karatay", email = "255180@astanait.edu.kz" }]
requires-python = ">=3.10"
keywords = ["misinformation", "fake-news", "nlp", "twitter", "tf-idf", "reproducibility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
app = ["streamlit>=1.36"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "build>=1.2",
]

[project.scripts]
misinfo = "misinfo_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/napp3r/misinfo-toolkit"
Issues = "https://github.com/napp3r/misinfo-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["misinfo_toolkit"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
